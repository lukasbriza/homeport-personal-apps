# Triggers an ArgoCD sync for homer when a deploy tag (homer-v*) is pushed. homer
# has no build step of its own — this repo just points at the upstream b4bz/homer
# image directly (see apps/homer/k8s/chart/values.yaml) — so unlike
# actual-build-push.yml / keycloak-build-push.yml there's no image to build, and
# the tag carries no version; it's purely the "deploy now" signal. The
# Application's automated sync is intentionally off (see
# infrastructure/argocd/k8s/applications/homer.yaml in homeport-infrastructure-apps)
# so nothing else can trigger a deploy.
name: Deploy homer

on:
  push:
    tags:
      - "homer-v*"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install argocd CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Sync via ArgoCD
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd app sync homer --server argocd.lukasbriza.eu --grpc-web
          argocd app wait homer --server argocd.lukasbriza.eu --grpc-web --health
