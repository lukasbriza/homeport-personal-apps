# Copy to values-prod.yaml (gitignored, see ../../.gitignore) and fill in real values.

domain: "https://vaultwarden.lukasbriza.eu"

ingress:
  enabled: true
  host: "vaultwarden.lukasbriza.eu"

# adminToken is NOT used below — infisical.enabled: true means ADMIN_TOKEN comes from
# your Homeport project instead. If you ever set infisical.enabled back to false,
# uncomment this and set a real value:
# adminToken: "replace-me"

infisical:
  enabled: true
  authRef:
    name: homeport-infisical-auth
    namespace: infisical-system
  projectId: "701566fc-6192-4ca5-b01b-b9e5a4c31214" # Homeport project
  environmentSlug: "prod"
  secretPath: "/vaultwarden"
