{{- if .Values.infisical.enabled }}
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Release.Name }}-secrets-sync
  namespace: {{ .Release.Namespace }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisical.authRef.name }}
    namespace: {{ .Values.infisical.authRef.namespace }}
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: {{ .Values.infisical.projectId | quote }}
      environmentSlug: {{ .Values.infisical.environmentSlug }}
      secretPath: {{ .Values.infisical.secretPath }}
  targets:
    - name: {{ .Release.Name }}-secrets
      namespace: {{ .Release.Namespace }}
      kind: Secret
      creationPolicy: Owner
      # Infisical keys use the old .env naming (SEAFILE_MYSQL_ROOT_PASSWORD
      # etc.), renamed here to the plain keys the container env vars
      # reference (see deployment.yaml, mariadb.yaml, redis.yaml).
      #
      # Note: the double-brace expression inside the backticks below is NOT
      # evaluated by Helm — Helm just prints it as literal text. It's
      # evaluated later, by the Infisical operator itself, against whatever
      # it fetched from your Infisical project.
      template:
        engineVersion: v1
        data:
          MYSQL_ROOT_PASSWORD: "{{`{{ .SEAFILE_MYSQL_ROOT_PASSWORD.Value }}`}}"
          MYSQL_DB_PASSWORD: "{{`{{ .SEAFILE_MYSQL_DB_PASSWORD.Value }}`}}"
          ADMIN_PASSWORD: "{{`{{ .SEAFILE_ADMIN_PASSWORD.Value }}`}}"
          JWT_PRIVATE_KEY: "{{`{{ .JWT_PRIVATE_KEY.Value }}`}}"
          REDIS_PASSWORD: "{{`{{ .REDIS_PASSWORD.Value }}`}}"
{{- end }}
