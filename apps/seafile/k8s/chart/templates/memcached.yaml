apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-memcached
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-memcached
  ports:
    - port: 11211
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-memcached
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-memcached
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-memcached
    spec:
      containers:
        - name: memcached
          image: {{ .Values.memcached.image }}
          ports:
            - containerPort: 11211
          resources:
            {{- toYaml .Values.memcached.resources | nindent 12 }}
