{{- if not .Values.infisical.enabled }}
# Manual secret — used only when infisical.enabled is false. When true, this same
# object (name/keys) is created and owned by the InfisicalStaticSecret template instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.mysqlRootPassword | quote }}
  MYSQL_DB_PASSWORD: {{ .Values.mysqlDbPassword | quote }}
  ADMIN_PASSWORD: {{ .Values.adminPassword | quote }}
  JWT_PRIVATE_KEY: {{ .Values.jwtPrivateKey | quote }}
  REDIS_PASSWORD: {{ .Values.redisPassword | quote }}
{{- end }}
