apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
  annotations:
    # Survive `helm uninstall` — local-path's reclaim policy is Delete, so
    # without this the PVC (and every synced file on it) would be wiped along
    # with the release. Must be deleted explicitly if that's really wanted.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
