apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-gateway
  namespace: {{ .Release.Namespace }}
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }

    :{{ .Values.gateway.port }} {
      handle /healthz {
        respond "ok" 200
      }
      {{- range $name, $s := (include "mcp.servers" . | fromYaml) }}
      {{- if $s.enabled }}

      # Strips the /{{ $name }} prefix, so /{{ $name }}/mcp reaches the server as /mcp.
      handle_path /{{ $name }}/* {
        @authorized header Authorization "Bearer {env.TOKEN_{{ $name | upper }}}"
        handle @authorized {
          reverse_proxy mcp-{{ $name }}:{{ $s.port }} {
            flush_interval -1
          }
        }
        handle {
          respond "Unauthorized" 401
        }
      }
      {{- end }}
      {{- end }}

      handle {
        respond "Not found" 404
      }
    }
