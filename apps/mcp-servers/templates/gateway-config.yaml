apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-gateway
  namespace: {{ .Release.Namespace }}
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }

    :{{ .Values.gateway.port }} {
      handle /healthz {
        respond "ok" 200
      }
      {{- range $name, $s := (include "mcp.servers" . | fromYaml) }}
      {{- if $s.enabled }}

      # Strips the /{{ $name }} prefix, so /{{ $name }}/mcp reaches the server as /mcp.
      handle_path /{{ $name }}/* {
        # Claude custom connectors reserve the Authorization header, so the token travels
        # in X-Mcp-Token. It is removed before the request reaches the server.
        @authorized header X-Mcp-Token "{env.TOKEN_{{ $name | upper }}}"
        handle @authorized {
          reverse_proxy mcp-{{ $name }}:{{ $s.port }} {
            header_up -X-Mcp-Token
            flush_interval -1
          }
        }
        handle {
          respond "Unauthorized" 401
        }
      }
      {{- end }}
      {{- end }}

      handle {
        respond "Not found" 404
      }
    }
