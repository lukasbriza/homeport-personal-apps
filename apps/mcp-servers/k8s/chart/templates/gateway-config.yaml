apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-gateway
  namespace: {{ .Release.Namespace }}
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }

    :{{ .Values.gateway.port }} {
      # Access log of every request, including the ones rejected here with 401/404 that never reach a
      # server. The token header is removed from the log.
      log {
        output stdout
        format filter {
          wrap json
          fields {
            request>headers>X-Auth-Token delete
          }
        }
      }

      handle /healthz {
        respond "ok" 200
      }
      {{- range $name, $s := (include "mcp.servers" . | fromYaml) }}
      {{- if $s.enabled }}

      # Strips the /{{ $name }} prefix, so /{{ $name }}/mcp reaches the server as /mcp.
      handle_path /{{ $name }}/* {
        # Claude custom connectors reserve the Authorization header and accept only a
        # fixed set of other header names, so the token travels in X-Auth-Token. It is
        # removed before the request reaches the server.
        @authorized header X-Auth-Token "{env.TOKEN_{{ $name | upper }}}"
        handle @authorized {
          reverse_proxy mcp-{{ $name }}:{{ $s.port }} {
            header_up -X-Auth-Token
            flush_interval -1
          }
        }
        handle {
          respond "Unauthorized" 401
        }
      }
      {{- end }}
      {{- end }}

      handle {
        respond "Not found" 404
      }
    }
