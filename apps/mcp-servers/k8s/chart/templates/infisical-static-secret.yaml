{{- if .Values.infisical.enabled }}
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Release.Name }}-secrets-sync
  namespace: {{ .Release.Namespace }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisical.authRef.name }}
    namespace: {{ .Values.infisical.authRef.namespace }}
  syncOptions:
    refreshInterval: 60s
  # One source per enabled server: <secretPath>/<server name>. The sources are merged, so
  # secret names must be unique across servers (<SERVER>_ prefix, see servers/<name>.yaml).
  sources:
    {{- range $name, $s := (include "mcp.servers" . | fromYaml) }}
    {{- if $s.enabled }}
    - projectId: {{ $.Values.infisical.projectId | quote }}
      environmentSlug: {{ $.Values.infisical.environmentSlug }}
      secretPath: {{ printf "%s/%s" ($.Values.infisical.secretPath | trimSuffix "/") $name | quote }}
    {{- end }}
    {{- end }}
  targets:
    - name: {{ .Release.Name }}-secrets
      namespace: {{ .Release.Namespace }}
      kind: Secret
      creationPolicy: Owner
      # The `{{ "{{ .KEY.Value }}" }}` expressions below are not evaluated by Helm: printf
      # emits them as literal text and the Infisical operator evaluates them against
      # the secrets it fetched. Secret keys are TOKEN_<SERVER> for gateway tokens and
      # <SERVER>_<ENV VAR> for server env vars.
      template:
        engineVersion: v1
        data:
          {{- range $name, $s := (include "mcp.servers" . | fromYaml) }}
          {{- if $s.enabled }}
          TOKEN_{{ $name | upper }}: {{ printf "{{ .%s.Value }}" $s.tokenKey | quote }}
          {{- range $envName, $infisicalKey := $s.secretEnv }}
          {{ $name | upper }}_{{ $envName }}: {{ printf "{{ .%s.Value }}" $infisicalKey | quote }}
          {{- end }}
          {{- end }}
          {{- end }}
{{- end }}
