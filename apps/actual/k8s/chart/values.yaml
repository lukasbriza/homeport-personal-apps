# Safe defaults — equivalent of .env.local. Real/prod values go in
# values-prod.yaml — see values-prod.example.yaml. Both files are committed
# (GitOps: ArgoCD reads them straight from git); nothing here is a secret —
# actual-server has no auth env vars, it manages its own login inside the
# app data itself (set up on first run).

image:
  repository: lbriza/actual
  # Bumped automatically by .github/workflows/actual-build-push.yml on every
  # actual-v* tag push — don't hand-edit this in normal use.
  tag: actual-v1

replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  size: 1Gi
  storageClassName: local-path

service:
  port: 5006

ingress:
  enabled: false
  host: ""

# Scale-to-zero via KEDA's HTTP Add-on — see homeport-infrastructure-apps
# DEPLOYMENT.md, "Opting an app into scale-to-zero". Requires KEDA + the HTTP
# Add-on already installed on the cluster (core/keda there). Off by default —
# flip to true only after confirming the cluster-wide install works.
scaleToZero:
  enabled: false
  minReplicas: 0
  maxReplicas: 1
  # How long with no matching requests before scaling back down to 0.
  cooldownPeriod: 300
  # Requests/second (averaged over the window below) that justifies scaling up.
  targetRequestRate: 5
  window: 1m
