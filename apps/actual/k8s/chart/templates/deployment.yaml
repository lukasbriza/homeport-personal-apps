apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      # Kubernetes auto-injects legacy Docker-links-style env vars for every
      # Service in the namespace (e.g. ACTUAL_PORT=tcp://10.43.x.x:5006 for
      # the Service named "actual" below). actual-server's own config reads
      # ACTUAL_PORT expecting a bare port number, so the injected URI string
      # fails validation ("ports must be within range") — disable the
      # injection entirely rather than fight the name collision.
      enableServiceLinks: false
      containers:
        - name: actual
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 5006
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /, port: 5006 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 5006 }
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
