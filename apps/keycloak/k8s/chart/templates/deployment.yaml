apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.infisical.enabled }}
  annotations:
    # Operator does a rolling restart of this Deployment whenever the managed
    # secret (see infisical-static-secret.yaml) changes — no manual redeploy.
    secrets.infisical.com/auto-reload: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.adminUsername | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ADMIN_PASSWORD
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-postgres:5432/keycloak"
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DB_PASSWORD
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            # Traefik terminates TLS and forwards plain HTTP — tells Keycloak
            # to trust X-Forwarded-* headers instead of expecting HTTPS itself.
            - name: KC_PROXY
              value: edge
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HOSTNAME_URL
              value: "https://{{ .Values.ingress.host }}"
            - name: KC_HOSTNAME_ADMIN_URL
              value: "https://{{ .Values.ingress.host }}"
            - name: KEYCLOAK_FRONTEND_URL
              value: "https://{{ .Values.ingress.host }}"
          ports:
            - containerPort: 8080
          # Keycloak (JVM/Quarkus) takes a while to come up — generous
          # initialDelay avoids a crash-loop from an impatient probe.
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
