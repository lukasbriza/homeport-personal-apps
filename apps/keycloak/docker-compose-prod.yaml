# NEED TO DEFINE THIS VARIABLES IN .ENV #
#########################################
#              Keycloak                 #
#########################################
# - KEYCLOAK_ADMIN
# - KEYCLOAK_ADMIN_PASSWORD
# - KEYCLOAK_DB_PASSWORD
# - KEYCLOAK_DB_USER
# - KEYCLOAK_DB_DATABASE
# - KEYCLOAK_PORT_EXPORT
# - HOST_KEYCLOAK_DATABASE_DATA_PATH
# - KC_DB_USERNAME
# - KC_DB_PASSWORD
# - KC_DB
#########################################
#               Volumes                 #
#########################################
# - HOST_KEYCLOAK_DATABASE_DATA_PATH

networks:
  keycloak-prod:

name: homeport-keycloak-prod

services:
  keycloak:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: keycloak-prod
    image: lbriza/keycloak:service-prod
    restart: always
    networks:
      - keycloak-prod
    depends_on:
      keycloak-database:
        condition: service_healthy
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_DB_USER=${KEYCLOAK_DB_USER}
      - KEYCLOAK_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KEYCLOAK_DB_DATABASE=${KEYCLOAK_DB_DATABASE}
      - KEYCLOAK_FRONTEND_URL=${KEYCLOAK_FRONTEND_URL}
      - KC_DB=${KC_DB}
      - KC_DB_URL=jdbc:postgresql://keycloak-database:5432/${KEYCLOAK_DB_DATABASE}
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_PROXY=edge
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_HOSTNAME_ADMIN_URL=${KC_HOSTNAME_ADMIN_URL}
      - KC_HOSTNAME_URL=${KC_HOSTNAME_URL}
    ports:
      - ${KEYCLOAK_PORT_EXPORT}:8080
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  keycloak-database:
    container_name: keycloak-database-prod
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - POSTGRES_DB=${KEYCLOAK_DB_DATABASE}
      - POSTGRES_USER=${KEYCLOAK_DB_USER}
    networks:
      - keycloak-prod
    volumes:
      - ${HOST_KEYCLOAK_DATABASE_DATA_PATH}:/var/lib/postgresql/data
    healthcheck:
      test: 'pg_isready --username=${KEYCLOAK_DB_USER} && psql --username=${KEYCLOAK_DB_USER} --list'
      interval: 5s
      timeout: 10s
      retries: 10
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
