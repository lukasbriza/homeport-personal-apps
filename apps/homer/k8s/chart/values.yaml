# Safe defaults — equivalent of .env.local. Real/prod values go in values-prod.yaml
# — see values-prod.example.yaml. Both files are committed (GitOps: ArgoCD reads
# them straight from git); nothing in here is a secret — homer has no auth.

image:
  repository: b4bz/homer
  tag: latest

replicas: 1

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

persistence:
  size: 500Mi
  storageClassName: local-path

service:
  port: 8080

ingress:
  enabled: false
  host: ""

# Scale-to-zero via KEDA's HTTP Add-on — see homeport-infrastructure-apps
# DEPLOYMENT.md, "Opting an app into scale-to-zero". Requires KEDA + the HTTP
# Add-on already installed on the cluster (core/keda there). Off by default —
# flip to true only after confirming the cluster-wide install works.
scaleToZero:
  enabled: false
  minReplicas: 0
  maxReplicas: 1
  # How long with no matching requests before scaling back down to 0.
  cooldownPeriod: 300
  # Requests/second (averaged over the window below) that justifies scaling up.
  targetRequestRate: 5
  window: 1m
