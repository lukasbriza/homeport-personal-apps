---
# Homepage configuration
# See https://fontawesome.com/search for icons options

title: "Homeport"
subtitle: "Dashboard"
logo: "assets/tools/Homeport1.png"
# icon: "fas fa-skull-crossbones" # Optional icon

header: true
footer: '<p>Homeport dashboard</p>' # set false if you want to hide it.

# Optional theme customization
theme: default

# Optional theme customization (color overrrides)
# overrrides can also be done using CSS vars
colors:
  light:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    highlight-hover: "#5a95f5"
    background: "#f5f5f5"
    card-background: "#ffffff"
    text: "#363636"
    text-header: "#ffffff"
    text-title: "#303030"
    text-subtitle: "#424242"
    card-shadow: rgba(0, 0, 0, 0.1)
    link: "#3273dc"
    link-hover: "#363636"
  dark:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    highlight-hover: "#5a95f5"
    background: "#131313"
    card-background: "#2b2b2b"
    text: "#eaeaea"
    text-header: "#ffffff"
    text-title: "#fafafa"
    text-subtitle: "#f5f5f5"
    card-shadow: rgba(0, 0, 0, 0.4)
    link: "#3273dc"
    link-hover: "#ffdd57"


# Optional navbar
# links: [] # Allows for navbar (dark mode, layout, and search) without any links

# Services
# First level array represent a group.
# Leave only a "items" key if not using group (group name, icon & tagstyle are optional, section separation will not be displayed).
#
# Infrastructure = apps deployed from homeport-infrastructure-apps.
# Personal = apps deployed from homeport-personal-apps (excluding homer itself).
# Public = intentionally empty for now — other, non-homelab projects go here later.
services:
  - name: "Infrastructure"
    icon: "fas fa-server"
    items:
      - name: "ArgoCD"
        logo: "assets/tools/ArgoCD.png"
        url: "https://argocd.lukasbriza.eu"
        target: "_blank"
      - name: "Headlamp"
        logo: "assets/tools/Headlamp.png"
        url: "https://k3s.lukasbriza.eu"
        target: "_blank"
      - name: "Infisical"
        logo: "assets/tools/Infisical.png"
        url: "https://infisical.lukasbriza.eu"
        target: "_blank"
      - name: "Pi-Hole"
        logo: "assets/tools/RaspberryPi.png"
        url: "http://192.168.1.41:82/admin"
        target: "_blank"
  - name: "Personal"
    icon: "fas fa-laptop"
    items:
      - name: "Actual"
        logo: "assets/tools/Actual.webp"
        url: "https://budgetmanager.lukasbriza.eu"
        target: "_blank"
      - name: "Donetick"
        logo: "assets/tools/Donetick.png"
        url: "https://donetick.lukasbriza.eu"
        target: "_blank"
      - name: "Keycloak"
        logo: "assets/tools/Keycloak.png"
        url: "https://auth.lukasbriza.eu"
        target: "_blank"
      - name: "Seafile"
        logo: "assets/tools/Seafile.png"
        url: "https://seafile.lukasbriza.eu"
        target: "_blank"
      - name: "VaultWarden"
        logo: "assets/tools/Vaultwarden.png"
        url: "https://vaultwarden.lukasbriza.eu"
        target: "_blank"
      - name: "Wishlist"
        logo: "assets/tools/Wishlist.png"
        url: "https://wishlist.lukasbriza.eu"
        target: "_blank"
  - name: "Public"
    icon: "fas fa-users"
