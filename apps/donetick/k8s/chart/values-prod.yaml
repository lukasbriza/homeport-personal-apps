publicHost: "donetick.lukasbriza.eu"

ingress:
  enabled: true
  host: "donetick.lukasbriza.eu"

# jwtSecret is NOT used below — infisical.enabled: true means DT_JWT_SECRET comes
# from your Homeport project instead. If you ever set infisical.enabled back to
# false, uncomment this and set a real value:
# jwtSecret: "replace-me"

infisical:
  enabled: true
  authRef:
    name: homeport-infisical-auth
    namespace: infisical-system
  projectId: "701566fc-6192-4ca5-b01b-b9e5a4c31214" # Homeport project
  environmentSlug: "prod"
  secretPath: "/donetick"

scaleToZero:
  enabled: true
