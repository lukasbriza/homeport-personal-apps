apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  # Mirrors apps/donetick/config/selfhosted.yaml (the local docker-compose config) —
  # keep the two in sync. jwt.secret and server.public_host are placeholders:
  # Donetick's Viper-based loader overrides them at runtime from the DT_JWT_SECRET
  # and DT_SERVER_PUBLIC_HOST env vars set in deployment.yaml.
  selfhosted.yaml: |
    name: "selfhosted"
    is_done_tick_dot_com: false
    is_user_creation_disabled: false

    database:
      type: "sqlite"
      migration: true

    jwt:
      secret: "set-via-DT_JWT_SECRET-env-var"
      session_time: 168h
      max_refresh: 1440h

    server:
      port: 2021
      read_timeout: 10s
      write_timeout: 10s
      rate_period: 60s
      rate_limit: 300
      cors_allow_origins:
        - "https://{{ .Values.publicHost }}"
      serve_frontend: true
      serve_swagger: true
      public_host: ""

    logging:
      level: "info"
      encoding: "json"
      development: false

    scheduler_jobs:
      due_job: 30m
      overdue_job: 3h
      pre_due_job: 3h

    realtime:
      enabled: true
      sse_enabled: true
      heartbeat_interval: 60s
      connection_timeout: 120s
      max_connections: 1000
      max_connections_per_user: 5
      event_queue_size: 2048
      cleanup_interval: 2m
      stale_threshold: 5m
      enable_compression: true
      enable_stats: true
      allowed_origins:
        - "*"
